[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novabite-multi-agent"
version = "0.1.0"
description = "Production-style multi-agent restaurant assistant"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pymongo",
    "langchain-community",
    "langchain_huggingface",
    "sentence-transformers",
    "faiss-cpu",
    "langchain_groq"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["test"]
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*"]